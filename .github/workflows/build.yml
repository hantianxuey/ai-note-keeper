name: Build Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # 12:00 Asia/Shanghai every day.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "20"
  ECS_HOST: ${{ secrets.ECS_HOST || '8.136.39.247' }}
  ECS_USER: ${{ secrets.ECS_USER || 'root' }}
  ECS_APP_PATH: ${{ secrets.ECS_APP_PATH || '/opt/ai-note-keeper' }}
  VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://8.136.39.247/api' }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ainotes
  CHROMA_URL: http://127.0.0.1:8000
  JWT_SECRET: ci-smoke-test-secret
  INCREMENTAL_COVERAGE_THRESHOLD: "60"
  RELEASES_TO_KEEP: "5"
  LOG_RETENTION_DAYS: "14"

jobs:
  build:
    name: Test, lint, build, and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ainotes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ainotes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chromadb:
        image: ghcr.io/chroma-core/chroma:latest
        ports:
          - 8000:8000
    outputs:
      package_id: ${{ steps.package-meta.outputs.package_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set package metadata
        id: package-meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            package_type="release"
          else
            package_type="snapshot"
          fi
          package_id="ai-note-keeper-${package_type}-${GITHUB_RUN_NUMBER}-${short_sha}"
          echo "package_type=${package_type}" >> "$GITHUB_OUTPUT"
          echo "package_id=${package_id}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_TYPE=${package_type}" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=${package_id}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Check frontend incremental coverage
        working-directory: frontend
        run: npm run test:coverage:incremental

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize CI database
        working-directory: backend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { Client } = require('pg');

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query(fs.readFileSync('src/config/init.sql', 'utf8'));
            await client.end();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Check backend incremental coverage
        working-directory: backend
        run: npm run test:coverage:incremental

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run E2E critical path
        shell: bash
        run: |
          set -euo pipefail

          NODE_ENV=production PORT=3100 DATABASE_URL="${DATABASE_URL}" CHROMA_URL="${CHROMA_URL}" node backend/dist/server.js > e2e-backend.log 2>&1 &
          backend_pid=$!
          VITE_API_URL=http://127.0.0.1:3100/api npm --prefix frontend run dev -- --host 127.0.0.1 --port 4173 > e2e-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "${backend_pid}" "${frontend_pid}" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/health/live >/dev/null; then
              break
            fi
            sleep 1
          done

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done

          E2E_BASE_URL=http://127.0.0.1:4173 npm --prefix frontend run test:e2e

      - name: Assemble release package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="release/${PACKAGE_ID}"
          mkdir -p "${release_dir}/frontend" "${release_dir}/backend" "${release_dir}/deploy"

          cp -a frontend/dist/. "${release_dir}/frontend/"
          cp -a backend/dist "${release_dir}/backend/"
          cp backend/package.json backend/package-lock.json backend/pm2.json "${release_dir}/backend/"
          cp deploy/nginx.conf "${release_dir}/deploy/"

          cat > "${release_dir}/VERSION" <<EOF
          package_id=${PACKAGE_ID}
          commit=${GITHUB_SHA}
          run_number=${GITHUB_RUN_NUMBER}
          built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          tar -czf "${PACKAGE_ID}.tar.gz" -C release "${PACKAGE_ID}"
          tar -tzf "${PACKAGE_ID}.tar.gz" >/dev/null

      - name: Smoke test release package
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          tar -xzf "${PACKAGE_ID}.tar.gz" -C "${smoke_dir}"

          cd "${smoke_dir}/${PACKAGE_ID}/backend"
          npm ci --omit=dev --ignore-scripts

          NODE_ENV=production PORT=3100 DATABASE_URL="${DATABASE_URL}" node dist/server.js > "${smoke_dir}/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "${smoke_dir}/server.log"
          exit 1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ID }}
          path: ${{ env.PACKAGE_ID }}.tar.gz
          retention-days: 30

      - name: Write package summary
        shell: bash
        run: |
          {
            echo "## Package"
            echo ""
            echo "\`${PACKAGE_ID}\`"
            echo ""
            echo "Type: \`${PACKAGE_TYPE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy scheduled release build
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    environment: production

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package_id }}

      - name: Configure SSH
        shell: bash
        env:
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ECS_SSH_PRIVATE_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${ECS_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "${ECS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${ECS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${ECS_HOST}" > ~/.ssh/known_hosts
          fi

      - name: Deploy package to ECS
        shell: bash
        env:
          PACKAGE_ID: ${{ needs.build.outputs.package_id }}
        run: |
          set -euo pipefail
          package_file="${PACKAGE_ID}.tar.gz"
          remote_package="/tmp/${package_file}"

          scp "${package_file}" "${ECS_USER}@${ECS_HOST}:${remote_package}"
          ssh "${ECS_USER}@${ECS_HOST}" \
            "PACKAGE_ID='${PACKAGE_ID}' APP_PATH='${ECS_APP_PATH}' PACKAGE_FILE='${remote_package}' RELEASES_TO_KEEP='${RELEASES_TO_KEEP}' LOG_RETENTION_DAYS='${LOG_RETENTION_DAYS}' bash -s" <<'EOF'
          set -euo pipefail

          release_dir="${APP_PATH}/releases/${PACKAGE_ID}"
          mkdir -p "${APP_PATH}/releases" "${APP_PATH}/shared/logs"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          tar -xzf "${PACKAGE_FILE}" -C "${APP_PATH}/releases"

          if [ -f "${APP_PATH}/backend/.env" ]; then
            cp "${APP_PATH}/backend/.env" "${release_dir}/backend/.env"
          fi

          mkdir -p "${release_dir}/backend/logs"
          cd "${release_dir}/backend"
          npm ci --omit=dev --ignore-scripts

          ln -sfnT "${release_dir}/frontend" "${APP_PATH}/frontend"
          ln -sfnT "${release_dir}/backend" "${APP_PATH}/backend"
          install -m 0644 "${release_dir}/deploy/nginx.conf" /etc/nginx/conf.d/ai-note-keeper.conf

          pm2 startOrReload "${APP_PATH}/backend/pm2.json" --env production
          pm2 save

          if command -v sudo >/dev/null 2>&1; then
            sudo nginx -t
            sudo nginx -s reload
          else
            nginx -t
            nginx -s reload
          fi

          keep="${RELEASES_TO_KEEP:-5}"
          find "${APP_PATH}/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -rn \
            | awk -v keep="${keep}" 'NR > keep { print substr($0, index($0, $2)) }' \
            | while IFS= read -r old_release; do
                rm -rf "${old_release}"
              done

          find "${APP_PATH}/shared/logs" -type f -mtime +"${LOG_RETENTION_DAYS:-14}" -delete 2>/dev/null || true
          EOF
