name: Deploy Package

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Artifact package id, for example ai-note-keeper-42-a1b2c3d"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  ECS_HOST: ${{ secrets.ECS_HOST || '8.136.39.247' }}
  ECS_USER: ${{ secrets.ECS_USER || 'root' }}
  ECS_APP_PATH: ${{ secrets.ECS_APP_PATH || '/opt/ai-note-keeper' }}
  RELEASES_TO_KEEP: "5"
  LOG_RETENTION_DAYS: "14"

jobs:
  deploy:
    name: Deploy selected package
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download package artifact by package id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          artifact_url="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PACKAGE_ID}&per_page=1" \
              --jq '.artifacts[0].archive_download_url'
          )"
          test -n "${artifact_url}"
          test "${artifact_url}" != "null"
          mkdir -p package
          gh api "${artifact_url}" > package/artifact.zip
          unzip -q package/artifact.zip -d package
          test -f "package/${PACKAGE_ID}.tar.gz"

      - name: Configure SSH
        shell: bash
        env:
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ECS_SSH_PRIVATE_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${ECS_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "${ECS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${ECS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${ECS_HOST}" > ~/.ssh/known_hosts
          fi

      - name: Deploy package to ECS
        shell: bash
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          package_file="package/${PACKAGE_ID}.tar.gz"
          remote_package="/tmp/${PACKAGE_ID}.tar.gz"

          scp "${package_file}" "${ECS_USER}@${ECS_HOST}:${remote_package}"
          ssh "${ECS_USER}@${ECS_HOST}" \
            "PACKAGE_ID='${PACKAGE_ID}' APP_PATH='${ECS_APP_PATH}' PACKAGE_FILE='${remote_package}' RELEASES_TO_KEEP='${RELEASES_TO_KEEP}' LOG_RETENTION_DAYS='${LOG_RETENTION_DAYS}' bash -s" <<'EOF'
          set -euo pipefail

          release_dir="${APP_PATH}/releases/${PACKAGE_ID}"
          mkdir -p "${APP_PATH}/releases" "${APP_PATH}/shared/logs"
          previous_frontend=""
          previous_backend=""
          if [ -L "${APP_PATH}/frontend" ]; then
            previous_frontend="$(readlink -f "${APP_PATH}/frontend")"
          fi
          if [ -L "${APP_PATH}/backend" ]; then
            previous_backend="$(readlink -f "${APP_PATH}/backend")"
          fi

          reload_nginx() {
            if command -v sudo >/dev/null 2>&1; then
              sudo nginx -t
              sudo nginx -s reload
            else
              nginx -t
              nginx -s reload
            fi
          }

          rollback_release() {
            echo "Smoke test failed. Rolling back to previous release."
            if [ -n "${previous_frontend}" ] && [ -d "${previous_frontend}" ]; then
              ln -sfnT "${previous_frontend}" "${APP_PATH}/frontend"
            fi
            if [ -n "${previous_backend}" ] && [ -d "${previous_backend}" ]; then
              ln -sfnT "${previous_backend}" "${APP_PATH}/backend"
              pm2 startOrReload "${APP_PATH}/backend/pm2.json" --env production
              pm2 save
              previous_release="$(dirname "${previous_backend}")"
              if [ -f "${previous_release}/deploy/nginx.conf" ]; then
                install -m 0644 "${previous_release}/deploy/nginx.conf" /etc/nginx/conf.d/ai-note-keeper.conf
              fi
              reload_nginx
            fi
          }

          smoke_test() {
            for _ in {1..30}; do
              if curl -fsS http://127.0.0.1:3000/health/ready >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          tar -xzf "${PACKAGE_FILE}" -C "${APP_PATH}/releases"

          if [ -f "${APP_PATH}/backend/.env" ]; then
            cp "${APP_PATH}/backend/.env" "${release_dir}/backend/.env"
          fi

          mkdir -p "${release_dir}/backend/logs"
          cd "${release_dir}/backend"
          npm ci --omit=dev --ignore-scripts
          npm run migrate

          ln -sfnT "${release_dir}/frontend" "${APP_PATH}/frontend"
          ln -sfnT "${release_dir}/backend" "${APP_PATH}/backend"
          install -m 0644 "${release_dir}/deploy/nginx.conf" /etc/nginx/conf.d/ai-note-keeper.conf

          pm2 startOrReload "${APP_PATH}/backend/pm2.json" --env production
          pm2 save

          reload_nginx

          if ! smoke_test; then
            rollback_release
            exit 1
          fi

          keep="${RELEASES_TO_KEEP:-5}"
          find "${APP_PATH}/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -rn \
            | awk -v keep="${keep}" 'NR > keep { print substr($0, index($0, $2)) }' \
            | while IFS= read -r old_release; do
                rm -rf "${old_release}"
              done

          find "${APP_PATH}/shared/logs" -type f -mtime +"${LOG_RETENTION_DAYS:-14}" -delete 2>/dev/null || true
          EOF
